<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Your Cart</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            padding: 20px;
        }
        h1 {
            color: #388b6f;
            text-align: center;
        }
        .cart-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #388b6f;
            color: white;
        }
        .btn {
            padding: 6px 12px;
            background: #388b6f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-danger {
            background: #cc0000;
        }
        .total {
            text-align: right;
            font-size: 20px;
            margin-top: 20px;
            color: #388b6f;
            font-weight: bold;
        }
        .order-btn {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background: #388b6f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Your Cart</h1>

<div class="cart-container">
    <table id="cartTable">
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Remove</th>
        </tr>
    </table>

    <div class="total" id="total"></div>

    <button class="order-btn" onclick="goToCheckout()">Order Now</button>
</div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let table = document.getElementById("cartTable");
let total = 0;

// Ensure every item has quantity
cart = cart.map(item => ({
    ...item,
    qty: item.qty ? parseInt(item.qty) : 1
}));

localStorage.setItem("cart", JSON.stringify(cart));

function renderCart() {

    table.innerHTML = `
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Remove</th>
        </tr>
    `;

    total = 0;

    if (cart.length === 0) {
        document.getElementById("total").innerText = "Your cart is empty";
        return;
    }

    cart.forEach((item, index) => {

        let row = table.insertRow();

        row.insertCell(0).innerText = item.name;

        // Correct price calculation with Indian format
        let itemTotal = item.price * item.qty;
        row.insertCell(1).innerText = "\u20B9" + itemTotal.toLocaleString("en-IN");

        let qtyCell = row.insertCell(2);
        qtyCell.innerHTML = `
            <input type="number" 
                   min="1" 
                   value="${item.qty}" 
                   onchange="updateQty(${index}, this.value)">
        `;

        let removeCell = row.insertCell(3);
        removeCell.innerHTML = `
            <button class="btn btn-danger" 
                    onclick="removeItem(${index})">
                Remove
            </button>
        `;

        total += itemTotal;
    });

    // Total in Indian format
    document.getElementById("total").innerText =
        "Total: \u20B9" + total.toLocaleString("en-IN");
}

function updateQty(index, value) {
    cart[index].qty = parseInt(value);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("cart", JSON.stringify(cart));
    renderCart();
}

function goToCheckout() {
    if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    window.location.href = "checkout.html";
}

renderCart();
</script>

</body>
</html>
